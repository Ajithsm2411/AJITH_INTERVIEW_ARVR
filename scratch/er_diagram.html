<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .diagram-container { width: 1360px; margin: 0 auto; background: #111827; border: 1px solid #1f293d; border-radius: 14px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .diagram-title { font-size: 20px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .diagram-subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="diagram-container">
    <div class="diagram-title">📊 FIGURE 3.2: RELATIONAL DATABASE ENTITY-RELATIONSHIP (ER) DIAGRAM</div>
    <div class="diagram-subtitle">Enterprise Relational Schema for Multi-User Spatial Telepresence, Rubric Assessments & Candidate Dossiers</div>
    <svg viewBox="0 0 1320 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="crow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 6 L 0 12" fill="none" stroke="#38bdf8" stroke-width="2"/></marker>
        <marker id="one" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="6" markerHeight="6" orient="auto"><line x1="6" y1="0" x2="6" y2="12" stroke="#38bdf8" stroke-width="2"/></marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/></filter>
      </defs>

      <!-- Entity 1: INTERVIEW_SESSION (Center Core) -->
      <g filter="url(#shadow)">
        <rect x="510" y="40" width="300" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <rect x="510" y="40" width="300" height="35" rx="8" fill="#0284c7"/>
        <text x="660" y="63" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">INTERVIEW_SESSION</text>
        <text x="530" y="95" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>SessionID : VARCHAR(36)</text>
        <text x="530" y="115" fill="#f8fafc" font-size="11">RoomKey : VARCHAR(64)</text>
        <text x="530" y="135" fill="#f8fafc" font-size="11">ScheduledAt : DATETIME</text>
        <text x="530" y="155" fill="#f8fafc" font-size="11">DurationSeconds : INT</text>
        <text x="530" y="175" fill="#f8fafc" font-size="11">Status : VARCHAR(24) [Active/Ended]</text>
        <text x="530" y="195" fill="#f8fafc" font-size="11">RecommendedHireStatus : VARCHAR(32)</text>
        <text x="530" y="215" fill="#f8fafc" font-size="11">FinalScore : DECIMAL(3,2)</text>
      </g>

      <!-- Entity 2: PARTICIPANT (Left) -->
      <g filter="url(#shadow)">
        <rect x="60" y="40" width="300" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <rect x="60" y="40" width="300" height="35" rx="8" fill="#0284c7"/>
        <text x="210" y="63" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">PARTICIPANT</text>
        <text x="80" y="95" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>ParticipantID : VARCHAR(36)</text>
        <text x="80" y="115" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>SessionID : VARCHAR(36)</text>
        <text x="80" y="135" fill="#f8fafc" font-size="11">FullName : VARCHAR(128)</text>
        <text x="80" y="155" fill="#f8fafc" font-size="11">Email : VARCHAR(128)</text>
        <text x="80" y="175" fill="#f8fafc" font-size="11">Role : VARCHAR(24) [Interviewer/Candidate]</text>
        <text x="80" y="195" fill="#f8fafc" font-size="11">ClientPlatform : VARCHAR(32) [WebXR/Unity]</text>
      </g>
      <line x1="510" y1="120" x2="360" y2="120" stroke="#38bdf8" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)"/>
      <text x="435" y="112" text-anchor="middle" fill="#94a3b8" font-size="11">1 : N (Hosts)</text>

      <!-- Entity 3: CANDIDATE_PROFILE (Far Left Bottom) -->
      <g filter="url(#shadow)">
        <rect x="60" y="300" width="300" height="190" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
        <rect x="60" y="300" width="300" height="35" rx="8" fill="#7e22ce"/>
        <text x="210" y="323" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">CANDIDATE_PROFILE</text>
        <text x="80" y="355" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>ProfileID : VARCHAR(36)</text>
        <text x="80" y="375" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>ParticipantID : VARCHAR(36)</text>
        <text x="80" y="395" fill="#f8fafc" font-size="11">TargetPosition : VARCHAR(128)</text>
        <text x="80" y="415" fill="#f8fafc" font-size="11">ExperienceYears : INT</text>
        <text x="80" y="435" fill="#f8fafc" font-size="11">MatchScorePercent : INT</text>
        <text x="80" y="455" fill="#f8fafc" font-size="11">SkillsList : TEXT (JSON)</text>
        <text x="80" y="475" fill="#f8fafc" font-size="11">DossierSummary : TEXT</text>
      </g>
      <line x1="210" y1="230" x2="210" y2="300" stroke="#a855f7" stroke-width="2" marker-start="url(#one)" marker-end="url(#one)"/>
      <text x="245" y="265" text-anchor="middle" fill="#c084fc" font-size="11">1 : 1 (Possesses)</text>

      <!-- Entity 4: EVALUATION_QUESTION (Top Right) -->
      <g filter="url(#shadow)">
        <rect x="960" y="40" width="300" height="185" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
        <rect x="960" y="40" width="300" height="35" rx="8" fill="#059669"/>
        <text x="1110" y="63" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">EVALUATION_QUESTION</text>
        <text x="980" y="95" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>QuestionID : VARCHAR(36)</text>
        <text x="980" y="115" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>SessionID : VARCHAR(36)</text>
        <text x="980" y="135" fill="#f8fafc" font-size="11">OrderIndex : INT (1..5)</text>
        <text x="980" y="155" fill="#f8fafc" font-size="11">Category : VARCHAR(64)</text>
        <text x="980" y="175" fill="#f8fafc" font-size="11">QuestionPrompt : TEXT</text>
        <text x="980" y="195" fill="#f8fafc" font-size="11">ReferenceAnswer : TEXT</text>
      </g>
      <line x1="810" y1="120" x2="960" y2="120" stroke="#38bdf8" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)"/>
      <text x="885" y="112" text-anchor="middle" fill="#94a3b8" font-size="11">1 : N (Contains)</text>

      <!-- Entity 5: QUESTION_SCORE (Center Bottom) -->
      <g filter="url(#shadow)">
        <rect x="510" y="300" width="300" height="190" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
        <rect x="510" y="300" width="300" height="35" rx="8" fill="#d97706"/>
        <text x="660" y="323" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">QUESTION_SCORE</text>
        <text x="530" y="355" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>ScoreID : VARCHAR(36)</text>
        <text x="530" y="375" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>QuestionID : VARCHAR(36)</text>
        <text x="530" y="395" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>EvaluatorID : VARCHAR(36)</text>
        <text x="530" y="415" fill="#f8fafc" font-size="11">StarRating : INT (1..5)</text>
        <text x="530" y="435" fill="#f8fafc" font-size="11">CandidateAnswerText : TEXT</text>
        <text x="530" y="455" fill="#f8fafc" font-size="11">EvaluatedAt : DATETIME</text>
      </g>
      <path d="M 1110 225 L 1110 380 L 810 380" fill="none" stroke="#f59e0b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)"/>
      <text x="960" y="370" text-anchor="middle" fill="#fcd34d" font-size="11">1 : N (Graded By)</text>

      <!-- Entity 6: INTERVIEWER_NOTE (Right Bottom) -->
      <g filter="url(#shadow)">
        <rect x="960" y="300" width="300" height="190" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
        <rect x="960" y="300" width="300" height="35" rx="8" fill="#0891b2"/>
        <text x="1110" y="323" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">INTERVIEWER_NOTE</text>
        <text x="980" y="355" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>NoteID : VARCHAR(36)</text>
        <text x="980" y="375" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>SessionID : VARCHAR(36)</text>
        <text x="980" y="395" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>EvaluatorID : VARCHAR(36)</text>
        <text x="980" y="415" fill="#f8fafc" font-size="11">NotesContent : TEXT</text>
        <text x="980" y="435" fill="#f8fafc" font-size="11">QuickTags : TEXT (JSON)</text>
        <text x="980" y="455" fill="#f8fafc" font-size="11">LastModifiedAt : DATETIME</text>
      </g>
      <path d="M 750 240 L 750 280 L 1050 280 L 1050 300" fill="none" stroke="#06b6d4" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)"/>
      <text x="900" y="275" text-anchor="middle" fill="#67e8f9" font-size="11">1 : N (Records)</text>

      <!-- Entity 7: TELEMETRY_STREAM_LOG (Bottom Span) -->
      <g filter="url(#shadow)">
        <rect x="280" y="540" width="760" height="190" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
        <rect x="280" y="540" width="760" height="35" rx="8" fill="#b91c1c"/>
        <text x="660" y="563" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">TELEMETRY_STREAM_LOG (High-Frequency 6-DoF Timeseries)</text>
        <text x="310" y="595" fill="#f8fafc" font-size="11"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>LogID : BIGINT AUTO_INCREMENT</text>
        <text x="310" y="615" fill="#f8fafc" font-size="11"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>SessionID : VARCHAR(36) | <tspan fill="#38bdf8" font-weight="bold">FK </tspan>ParticipantID : VARCHAR(36)</text>
        <text x="310" y="635" fill="#f8fafc" font-size="11">TimestampNanos : BIGINT (Epoch)</text>
        <text x="310" y="655" fill="#f8fafc" font-size="11">HeadPosX, HeadPosY, HeadPosZ : FLOAT | HeadYaw, HeadPitch, HeadRoll : FLOAT</text>
        <text x="310" y="675" fill="#f8fafc" font-size="11">VoiceActivityLevel : FLOAT (0.0..1.0) | ActiveVisemeWeight : FLOAT</text>
        <text x="310" y="695" fill="#f8fafc" font-size="11">NetworkRoundTripLatencyMs : FLOAT (&lt;12ms SLA)</text>
      </g>
      <line x1="660" y1="490" x2="660" y2="540" stroke="#ef4444" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)"/>
      <text x="730" y="520" text-anchor="middle" fill="#fca5a5" font-size="11">1 : N (Captures)</text>
    </svg>
  </div>
</body>
</html>
