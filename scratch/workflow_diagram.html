<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>

    body { background: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }

  </style>
</head>
<body>

        <text x="960" y="122" text-anchor="middle" fill="#a7f3d0" font-size="11">Peer Multiplexing & Heartbeat</text>

      <path d="M 960 140 L 960 210" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

      </g>
      <path d="M 150 300 L 150 370" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <!-- ROW 3 -->

        <rect x="40" y="370" width="220" height="90" rx="10" fill="url(#roseGrad)" stroke="#fda4af" stroke-width="2"/>
        <text x="150" y="405" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">9. CONCLUDE MODAL</text>
        <text x="150" y="425" text-anchor="middle" fill="#ffe4e6" font-size="11">Verify Complete Assessment</text>

      </g>
      <line x1="260" y1="415" x2="310" y2="415" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <line x1="530" y1="415" x2="580" y2="415" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <g filter="url(#shadow)">
        <rect x="580" y="370" width="220" height="90" rx="10" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2"/>
        <text x="690" y="405" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14">11. RECRUITMENT DB</text>
        <text x="690" y="425" text-anchor="middle" fill="#a7f3d0" font-size="11">Executive ATS Archive</text>
        <text x="690" y="442" text-anchor="middle" fill="#a7f3d0" font-size="11">Telemetry & Audit Trails</text>

      <!-- Legend -->
      <rect x="40" y="500" width="1030" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="60" y="525" fill="#38bdf8" font-size="12" font-weight="700">PIPELINE SUBSYSTEMS:</text>
      <circle cx="240" cy="522" r="6" fill="#0284c7"/><text x="255" y="526" fill="#cbd5e1" font-size="12">Client VR & Sensor Loop</text>

      <circle cx="835" cy="522" r="6" fill="#f59e0b"/><text x="850" y="526" fill="#cbd5e1" font-size="12">Rubric & Candidate Dossier</text>
      <text x="60" y="555" fill="#94a3b8" font-size="11">Target Latency: Motion-to-Photon &lt; 12ms | Network Heartbeat: 30Hz WebSocket Pings | Frame Rate: 90Hz Sustained WebGL/WebXR</text>

</html>
